 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.49.0")
    implementation("org.testng:testng:7.12.0")
    implementation("org.apache.logging.log4j:log4j-core:2.26.1")
    implementation("org.apache.logging.log4j:log4j-api:2.26.1")
    implementation("com.aventstack:extentreports:5.1.2")
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'seleium.framework.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

test {
    useTestNG() {
        useDefaultListeners = true // Enable default TestNG listeners
        outputDirectory = file("$projectDir/test-output") // Specify the output directory for TestNG reports
        //suites 'src/test/resources/testng.xml' // Specify the TestNG suite XML file
    }
}
